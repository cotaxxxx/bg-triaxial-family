<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle-energy map on triaxial ellipsoids — linked viewer</title>
<style>
:root{--bg:#fbfbf9;--fg:#1c2330;--mut:#5b6472;--line:#d5d9e0;--card:#fff;--z1:#0072B2;--z2:#56B4E9;--d1:#D55E00;--d2:#E69F00;--unc:#7a3fb5;--ok:#1b7f4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif}
header{padding:14px 16px 6px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:19px;margin:0 0 2px;line-height:1.3}
.sub{color:var(--mut);font-size:13px;max-width:70ch}
button,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:#1c2330;color:#fff;border-color:#1c2330}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:8px 16px 16px}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card h2{font-size:14px;margin:0 0 6px;font-weight:600}
#map{width:100%;height:auto;aspect-ratio:1/1.02;touch-action:none;display:block;border-radius:8px;background:#f1f2f4;cursor:crosshair}
#view{width:100%;aspect-ratio:1/1.02;display:block;border-radius:8px;background:#f6f7f9;touch-action:none;cursor:grab}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row label{font-size:13px;color:var(--mut)}
input[type=range]{flex:1;min-width:120px}
#status{font-variant-numeric:tabular-nums;font-size:14px;margin-top:8px}
#event{margin-top:6px;padding:8px 10px;border-radius:8px;background:#f1f4f8;font-size:14px;min-height:3.2em}
#event.on{background:#fff6e0;border:1px solid #f0d48a}
.legend{display:grid;gap:6px;font-size:13px;margin-top:8px}
.legend div{display:flex;gap:8px;align-items:flex-start}
.sw{flex:0 0 26px;height:14px;margin-top:3px;border-radius:3px}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;color:#fff;white-space:nowrap;margin-top:2px}
.tag.a{background:var(--ok)}.tag.b{background:#6b7280}.tag.c{background:var(--unc)}
.arcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 12px;font-size:13px;margin-top:6px}
.arcs span i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
footer{padding:4px 16px 24px;color:var(--mut);font-size:12px;max-width:110ch;overflow-wrap:anywhere}
footer code{font-size:11px}
.note{font-size:12.5px;color:var(--mut);margin-top:6px}
svg text{font:12px system-ui,sans-serif;fill:#333}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-t="title"></h1>
    <div class="sub" data-t="sub"></div>
  </div>
  <div class="row" style="margin:0">
    <button id="bEn" aria-pressed="true">English</button>
    <button id="bJa" aria-pressed="false">日本語</button>
  </div>
</header>
<main>
  <section class="card">
    <h2 data-t="mapTitle"></h2>
    <svg id="map" role="img" aria-label="shape map"></svg>
    <div class="row">
      <label data-t="zoom"></label>
      <button id="zOut">−</button><button id="zIn">+</button><button id="zReset" data-t="reset"></button>
      <label data-t="path" style="margin-left:8px"></label>
      <select id="path"></select>
      <button id="play" data-t="play"></button>
    </div>
    <div class="row"><input id="slider" type="range" min="0" max="1000" value="0" aria-label="position on the path"></div>
    <div class="arcs" id="arcs"></div>
    <div class="legend">
      <div><span class="tag a">A</span><span data-t="legA"></span></div>
      <div><span class="tag b">B</span><span data-t="legB"></span></div>
      <div id="legCrow"><span class="tag c">C</span><span data-t="legC"></span></div>
    </div>
  </section>
  <section class="card">
    <h2 data-t="viewTitle"></h2>
    <canvas id="view"></canvas>
    <div id="status"></div>
    <div id="event"></div>
    <div class="row" id="uncRow"><label><input type="checkbox" id="unc" checked> <span data-t="uncToggle"></span></label></div>
    <div class="note" data-t="uncNote" id="uncNote"></div>
    <div class="note" data-t="scope"></div>
  </section>
</main>
<footer>
  <div data-t="foot1"></div>
  <div id="foot2"></div>
  <div data-t="foot3"></div>
</footer>
